
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tmdb-dss"
version = "1.0.0"
description = "Movie Investment Decision Support System using TMDB data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "google-cloud-bigquery>=3.0",
    "db-dtypes>=1.0",
    "pyarrow>=12.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
